name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The recipes are the gate, here and on a laptop. CI runs `just` itself rather
  # than a copy of what the recipes say, so the two cannot drift and a
  # contributor who runs `just gate` has run what CI will run.
  gate:
    name: just gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `rust-toolchain.toml` names the toolchain and its components, so the
      # version lives in one place. Nightly is this repository's tooling —
      # rustfmt's import grouping and the coverage recipe's branch
      # instrumentation are nightly-only options — and never the library's:
      # the `stable` job below is what says the crate itself compiles there.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      # `check` is fmt, compile, clippy and rustdoc, each with warnings denied.
      - run: just check
      # `features` compiles the library in every combination a consumer can
      # select, and proves the typed half of the example links no clap.
      - run: just features
      - run: just test
      # Runs the generator and fails if it no longer reproduces what is
      # committed. Nothing else in the gate executes the bless step.
      - run: just blessed
      # `package` builds the crate from its own tarball, which is the only
      # check that it stands up outside this workspace.
      - run: just package

  # The published crate compiles and its tests pass on stable Rust. Nothing in
  # the library may need a nightly feature — the nightly the gate runs on is
  # this repository's formatter and coverage tooling, not the crate's — and if
  # this job goes red that promise is broken.
  stable:
    name: rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable build -p typed-openapi --all-features
      - run: cargo +stable test -p typed-openapi --all-features
