name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The recipes are the gate, here and on a laptop. CI runs `just` itself rather
  # than a copy of what the recipes say, so the two cannot drift and a
  # contributor who runs `just gate` has run what CI will run.
  gate:
    name: just gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `rust-toolchain.toml` names the toolchain and its components, so the
      # version lives in one place. Nightly is this repository's tooling —
      # rustfmt's import grouping and the coverage recipe's branch
      # instrumentation are nightly-only options — and never the library's:
      # the `stable` job below is what says the crate itself compiles there.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      # `check` is fmt, compile, clippy and rustdoc, each with warnings denied.
      - run: just check
      # `features` compiles the library in every combination a consumer can
      # select, and proves the typed half of the example links no clap.
      - run: just features
      - run: just test
      # `package` builds the crate from its own tarball, which is the only
      # check that it stands up outside this workspace.
      - run: just package

  # The published crate compiles and its tests pass on stable Rust, at the
  # version it declares and at the current release. Nothing in the library may
  # need a nightly feature; if this job goes red, that promise is broken.
  stable:
    name: rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85 is what clap 4.6, hashbrown 0.17 and edition 2024 set between
        # them, and it is what `rust-version` declares.
        rust: ["1.85", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ matrix.rust }} build -p typed-openapi --all-features
      - run: cargo +${{ matrix.rust }} test -p typed-openapi --all-features
