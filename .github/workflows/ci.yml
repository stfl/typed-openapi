name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning that only fails locally is not a gate. Every job below promotes
  # the `warn` levels in `[workspace.lints]` the same way `just check` does.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  gate:
    name: fmt, clippy, docs, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `rust-toolchain.toml` names the toolchain and its components; rustup
      # reads it, so the version lives in one place rather than in every job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2

      # A feature that adds or removes whole items has to be compiled in every
      # combination a consumer can select, because nothing else finds an item
      # that exists in only one of them.
      - run: cargo check -p typed-openapi
      - run: cargo check -p typed-openapi --no-default-features
      - run: cargo check -p typed-openapi --no-default-features --features clap
      - run: cargo check -p typed-openapi --no-default-features --features document
      - run: cargo check -p typed-openapi --no-default-features --features generate
      - run: cargo check -p typed-openapi --no-default-features --features builder
      - run: cargo check -p typed-openapi --all-features --all-targets
      - run: cargo doc -p typed-openapi --no-deps --no-default-features
      - run: cargo check -p cli --features reqwest-client

      # The typed half of an adoption must link no argument parser. This is the
      # command that proves it: `api` takes the library with
      # `default-features = false`, so a `clap` in its tree is a regression.
      - name: the typed half stays clap-free
        run: |
          if cargo tree -p api -e normal --prefix none | grep -q '^clap'; then
            echo "::error::clap reached api's normal dependency tree"
            cargo tree -p api -e normal | grep -i clap
            exit 1
          fi

  msrv:
    name: rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the published crate declares, and the current stable
        # release. The library compiles on stable; only this repository's own
        # tooling — the formatter's unstable options, the coverage recipe —
        # wants nightly.
        rust: ["1.85", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ matrix.rust }} check -p typed-openapi --all-features

  package:
    name: what crates.io would receive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p typed-openapi --list
      # Builds the crate from its own tarball, which is the only check that it
      # stands up outside this workspace.
      - run: cargo package -p typed-openapi
