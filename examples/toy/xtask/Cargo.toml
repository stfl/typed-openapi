[package]
name = "xtask"
edition.workspace = true
version.workspace = true
publish = false
description = "Bless step: the vendor's document plus the adopter's Overlay in, the overlaid document and the generated api source out."

[dependencies]
# The generator itself. An adopter's xtask needs nothing else: typify, the
# syntax-tree printer and the OpenAPI object model all sit behind these features
# rather than in the adopter's own manifest.
#
# `generate` implies `document`; both are named because this is the one manifest
# in the workspace that may ask for the document reader from a section a build
# without test targets reads, and `cli/tests/feature_gate.rs` reads these lines
# as text to prove that no other member does.
typed-openapi = { path = "../../../typed-openapi", features = ["document", "generate"] }

[lints]
workspace = true
