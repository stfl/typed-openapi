[package]
name = "api"
edition.workspace = true
version.workspace = true
publish = false
description = "Owned Rust types and typed operations for the Toy Accounting API."

[features]
# Forwarded to the crate holding the generated wrappers; `api` has nothing of
# its own to gate.
builder = ["api-generated/builder"]

[dependencies]
api-generated = { path = "../api-generated" }
# Named here as well as under `api-generated`, because this crate re-exports the
# crate whole beside the generated types: an adopter's own code names `api` and
# nothing below it.
money = { path = "../money" }
typed-openapi = { path = "../../../typed-openapi", default-features = false }

[dev-dependencies]
# `tests/typed.rs`, `tests/corrections.rs` and `tests/money.rs` reduce the
# committed document again and hold the committed blob, the correction list and
# the hand-owned `Money` to it. That is the one thing in this crate that needs
# the reader; the library itself never does.
typed-openapi = { path = "../../../typed-openapi", features = ["document"] }
http = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }

[lints]
workspace = true
