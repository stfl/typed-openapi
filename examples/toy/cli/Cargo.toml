[package]
name = "cli"
edition.workspace = true
version.workspace = true
publish = false
description = "The toy accounting CLI: every operation from the document, plus hand-written verbs."

[[bin]]
name = "toy"
path = "src/main.rs"

[features]
default = ["ureq-client"]
ureq-client = ["dep:ureq"]
reqwest-client = ["dep:reqwest"]
# Forwarded so the gate compiles a crate that actually *calls* the generated
# wrappers with the builder on. `cargo check -p api-generated --features
# builder` cannot catch a wrapper whose signature changed, because that crate
# never calls its own wrappers.
builder = ["api/builder"]

[dependencies]
# The typed half of the adoption: the document, the model and every wrapper.
api = { path = "../api" }
# The root command the generated tree is mounted under, and the verbs by hand.
clap = { workspace = true }
# The command tree, and the gate that decides whether a request is sent.
typed-openapi = { path = "../../../typed-openapi" }
# The shell completion scripts, static and dynamic.
clap_complete = { workspace = true }
# The request and response the client adapters carry across the seam.
http = { workspace = true }
# The async adapter of the seam, behind `reqwest-client`.
reqwest = { workspace = true, optional = true }
# The `Serialize` bound that a verb's printed value goes through.
serde = { workspace = true }
# Prints a response body as pretty JSON.
serde_json = { workspace = true }
# Derives `Error` for what one invocation can fail with.
thiserror = { workspace = true }
# The sync client the binary ships with, behind `ureq-client`.
ureq = { workspace = true, optional = true }

[dev-dependencies]
# `Document::load`, which the e2e case for a free-text path parameter needs: the
# toy's document has none, and its binary starts from the blob.
typed-openapi = { path = "../../../typed-openapi", features = ["document"] }

[lints]
workspace = true
