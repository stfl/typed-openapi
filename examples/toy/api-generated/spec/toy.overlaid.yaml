openapi: 3.0.3
info:
  title: Toy Accounting API
  version: '1.0'
servers:
- url: http://localhost:9999
paths:
  /vouchers:
    get:
      operationId: listVouchers
      summary: List vouchers
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/VoucherStatus'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: type
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voucher'
    post:
      operationId: createVoucher
      summary: Create a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    get:
      operationId: getVoucher
      summary: Fetch one voucher
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
    put:
      operationId: updateVoucher
      summary: Replace a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/enshrine:
    post:
      operationId: enshrineVoucher
      summary: Finalize a voucher (irreversible)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
      x-cli-gates:
      - enshrine
  /vouchers/{id}/render:
    get:
      operationId: renderVoucher
      summary: Render the voucher to PDF and store it on the server (this GET writes)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
      x-cli-writes: true
  /vouchers/{id}/send-by-email:
    post:
      operationId: sendVoucherByEmail
      summary: Email the voucher to a recipient
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Delivery'
      responses:
        '202':
          description: Accepted
      x-cli-gates:
      - email
  /contacts:
    post:
      operationId: createContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document as a PDF
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created
  /documents-multipart:
    post:
      operationId: uploadDocumentMultipart
      summary: Upload a document as multipart parts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
  /vouchers/{id}/archive:
    post:
      operationId: archiveVoucher
      summary: Archive a voucher (undocumented; vendor ships it)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
components:
  schemas:
    VoucherStatus:
      type: string
      enum:
      - draft
      - open
      - paid
    Voucher:
      type: object
      required:
      - total
      - currency
      - status
      properties:
        id:
          type: integer
          format: int64
          description: Server-assigned id
        total:
          type: string
          format: money
          description: Decimal amount as a string
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: ISO 4217 code
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/VoucherStatus'
        internal_ref:
          type: string
          description: Vendor's internal bookkeeping reference (undocumented)
    Delivery:
      type: object
      required:
      - recipient
      properties:
        recipient:
          type: string
          description: Mailbox the voucher is sent to
        note:
          $ref: '#/components/schemas/Memo'
    Memo:
      type: string
      description: |
        A note the sender keeps against the voucher.

        The server stores it verbatim and never reads it. Senders paste a
        reference in, under a heading of their own:

            PO-1234, approved by finance

        and it comes back exactly as it was sent.
    Address:
      type: object
      required:
      - street
      - city
      properties:
        street:
          type: string
        city:
          type: string
          example: Vienna
    Contact:
      type: object
      required:
      - name
      - address
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
    Money:
      type: string
      format: money
      description: A decimal amount carried in a string.
      pattern: ^-?[0-9]+(\.[0-9]{1,2})?$
    Currency:
      type: string
      description: An ISO 4217 currency code.
      pattern: ^[A-Z]{3}$
