openapi: 3.0.3
info:
  title: Toy Accounting API
  version: "1.0"
servers:
  - url: http://localhost:9999
paths:
  /vouchers:
    get:
      operationId: listVouchers
      summary: List vouchers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VoucherStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voucher'
    post:
      operationId: createVoucher
      summary: Create a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getVoucher
      summary: Fetch one voucher
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
    put:
      operationId: updateVoucher
      summary: Replace a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/enshrine:
    post:
      operationId: enshrineVoucher
      summary: Finalize a voucher (irreversible)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/render:
    get:
      operationId: renderVoucher
      summary: Render the voucher to PDF and store it on the server (this GET writes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /contacts:
    post:
      operationId: createContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document (vendor misspells the media type)
      requestBody:
        required: true
        content:
          form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
  /documents-multipart:
    post:
      operationId: uploadDocumentMultipart
      summary: Upload a document (correctly spelled media type)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
components:
  schemas:
    VoucherStatus:
      type: string
      enum: [draft, open, paid]
    Voucher:
      type: object
      required: [total, currency, status]
      properties:
        id:
          type: integer
          format: int64
          description: Server-assigned id
        total:
          type: string
          format: money
          description: Decimal amount as a string
        currency:
          type: string
          description: ISO 4217 code
        status:
          $ref: '#/components/schemas/VoucherStatus'
    Address:
      type: object
      required: [street, city]
      properties:
        street:
          type: string
        city:
          type: string
    Contact:
      type: object
      required: [name, address]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
