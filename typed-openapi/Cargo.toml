[package]
name = "typed-openapi"
description = "Typed Rust calls and a clap command tree from one OpenAPI document, with every write behind a dry-run gate."
keywords = ["openapi", "clap", "cli", "codegen", "http"]
categories = [
    "command-line-interface",
    "api-bindings",
    "web-programming::http-client",
    "development-tools",
]
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The note for an agent that edits `src/` is not what a crate's reader gets.
exclude = ["src/CLAUDE.md"]

# The two words a command line spends on consent, and what a document that
# wants one of them is told. It reads a document, so it wants that feature.
[[example]]
name = "clashing-words"
required-features = ["document"]

# The dev-dependency on this crate below turns `document` and `generate` on for
# a run inside the workspace, and `cargo package` drops it. A target that names
# no feature is a compile error in the tarball, where a target that names its
# features is skipped when they are off. `just package` runs the tarball both
# ways. A target that builds a generator `Settings` or names a generator error
# wants `generate`, every other one reads a document and wants `document`, and
# each that mounts the command tree or names one of its types wants `clap`
# beside it.
[[test]]
name = "dispatch"
required-features = ["document", "clap"]

[[test]]
name = "document"
required-features = ["document", "clap"]

[[test]]
name = "drift"
required-features = ["document"]

[[test]]
name = "errors"
required-features = ["generate", "clap"]

[[test]]
name = "generate"
required-features = ["generate"]

[[test]]
name = "hostile"
required-features = ["generate", "clap"]

[[test]]
name = "required"
required-features = ["document"]

[[test]]
name = "summary"
required-features = ["document"]

[[test]]
name = "yaml"
required-features = ["document"]

[features]
default = ["clap"]

# The command tree and the trip back from `ArgMatches` to a sent request: the
# `tree` module and nothing else. A crate that only wants typed calls turns it
# off and links no argument parser.
clap = ["dep:clap"]

# Reading an OpenAPI document: `Document::load`, `overlay::apply` and the
# `$ref` resolver behind them. A bless step turns it on. A binary that starts
# from `Document::from_blob` leaves it off, and then the YAML parser, the
# OpenAPI object model and the Overlay engine are not in what it compiles,
# links or audits.
document = ["dep:openapiv3", "dep:roas-overlay", "dep:serde-saphyr"]

# The generator: the `generate` module a bless step calls to write the typed
# wrappers, the Rust schema types and the reduced model. It reads a document,
# so it implies `document`, and it pulls typify and a syntax-tree printer
# behind it. Nothing a shipping binary enables.
generate = [
    "document",
    "dep:heck",
    "dep:prettyplease",
    "dep:proc-macro2",
    "dep:quote",
    "dep:schemars",
    "dep:syn",
    "dep:typify",
]

# `bon`'s builder on the generated wrappers, so a call with four arguments
# names them at the call site. Off by default: it puts two proc-macro crates
# in the graph of the crate that holds the generated code, and
# `docs/builders.md` measures what that costs.
builder = ["dep:bon"]

[dependencies]
# The builder macro on a generated wrapper, re-exported so the versions agree.
bon = { workspace = true, optional = true }
# The command tree and the trip back from `ArgMatches` to a sent request.
clap = { workspace = true, optional = true }
# Turns the document's names into the Rust names the generator writes.
heck = { workspace = true, optional = true }
# The request type of the client seam, `http::Request<Vec<u8>>`.
http = { workspace = true }
# The OpenAPI object model a document is read through while it is reduced.
openapiv3 = { workspace = true, optional = true }
# The encoding of the reduced model, the blob a shipped binary loads.
postcard = { workspace = true }
# Prints the generated syntax tree as formatted Rust source.
prettyplease = { workspace = true, optional = true }
# The token streams the generator builds its code in.
proc-macro2 = { workspace = true, optional = true }
# Writes the generated wrappers as Rust syntax with the values spliced in.
quote = { workspace = true, optional = true }
# Runs a document's `pattern` on the engine typify puts in a generated newtype.
regress = { workspace = true }
# Applies the adopter's Overlays to the vendor's document.
roas-overlay = { workspace = true, optional = true }
# The schema types typify takes in, built from the document's own schemas.
schemars = { workspace = true, optional = true }
# Derives (de)serialisation for the reduced model. Its `Serialize` and
# `DeserializeOwned` bounds are what a typed call's body and response go through.
serde = { workspace = true }
# Reads the document and each Overlay as YAML, and writes the overlaid one.
serde-saphyr = { workspace = true, optional = true }
# A body and a document as JSON values, which an Overlay is applied to.
serde_json = { workspace = true }
# A body refused by `client::fits` names where it stopped — `positions[1].flag`
# — which serde's own message does not, and a nested body sent whole through a
# file is exactly where a caller cannot find the field by eye. An Overlay that
# has the wrong shape names the action it stopped in the same way, from
# `actions[2]`. It wraps the deserialiser serde_json already drives and brings
# `itoa` with it; tracking the path by hand is that same wrapper written again.
serde_path_to_error = { workspace = true }
# Parses typify's output into the tree the generator rewrites and prints.
syn = { workspace = true, optional = true }
# Derives `Error` and its messages for every error type the crate returns.
thiserror = { workspace = true }
# Writes the Rust type for each schema the document names.
typify = { workspace = true, optional = true }

[dev-dependencies]
# This crate's own tests read documents and generate from them. Depending on
# itself is how a test target turns a feature on without any library consumer
# inheriting it: a dev-dependency's features reach `cargo test` and
# `cargo clippy --all-targets` and stop there.
typed-openapi = { path = ".", features = ["document", "generate"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
