openapi: 3.0.3
info:
  title: Toy Accounting API
  version: "1.0"
servers:
  - url: http://localhost:9999
paths:
  /vouchers:
    get:
      operationId: listVouchers
      summary: List vouchers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VoucherStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Voucher'
    post:
      operationId: createVoucher
      summary: Create a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getVoucher
      summary: Fetch one voucher
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
    put:
      operationId: updateVoucher
      summary: Replace a voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Voucher'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/enshrine:
    post:
      operationId: enshrineVoucher
      summary: Finalize a voucher (irreversible)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/render:
    get:
      operationId: renderVoucher
      summary: Render the voucher to PDF and store it on the server (this GET writes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voucher'
  /vouchers/{id}/send-by-email:
    post:
      operationId: sendVoucherByEmail
      summary: Email the voucher to a recipient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Delivery'
      responses:
        '202':
          description: Accepted
  /contacts:
    post:
      operationId: createContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
  /documents:
    post:
      operationId: uploadDocument
      summary: Upload a document as a PDF
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Created
  /documents-multipart:
    post:
      operationId: uploadDocumentMultipart
      summary: Upload a document as multipart parts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created
  /ledger/entries:
    post:
      operationId: createLedgerEntry
      summary: Post an amount to a ledger account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, amount]
              properties:
                account:
                  $ref: '#/components/schemas/LedgerAccount'
                amount:
                  type: string
                  format: money
                  description: Decimal amount as a string
                memo:
                  $ref: '#/components/schemas/Memo'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    $ref: '#/components/schemas/LedgerAccount'
                  balance:
                    type: string
                    format: money
components:
  schemas:
    VoucherStatus:
      type: string
      enum: [draft, open, paid]
    Voucher:
      type: object
      required: [total, currency, status]
      properties:
        id:
          type: integer
          format: int64
          description: Server-assigned id
        total:
          type: string
          format: money
          description: Decimal amount as a string
        currency:
          type: string
          description: ISO 4217 code
        status:
          $ref: '#/components/schemas/VoucherStatus'
    Delivery:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          description: Mailbox the voucher is sent to
        note:
          $ref: '#/components/schemas/Memo'
    Memo:
      type: string
      description: |
        A note the sender keeps against the voucher.

        The server stores it verbatim and never reads it. Senders paste a
        reference in, under a heading of their own:

            PO-1234, approved by finance

        and it comes back exactly as it was sent.
    Address:
      type: object
      required: [street, city]
      properties:
        street:
          type: string
        city:
          type: string
    LedgerAccount:
      type: string
      description: The four-digit account an entry is posted to.
      pattern: '^[0-9]{4}$'
    Contact:
      type: object
      required: [name, address]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          $ref: '#/components/schemas/Address'
