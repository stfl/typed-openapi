overlay: 1.1.0
info:
  title: Corrections to the Toy Accounting API
  version: "1.0"
  description: >-
    What the vendor got wrong, as standard OpenAPI Overlay 1.1 actions.
    `spec/toy.yaml` is never edited.

    This layer is about the vendor's API and nothing else: an undocumented
    field, an undocumented operation, and two values the vendor names a rule
    for — one in a `format`, one in prose — and never states. Applying it alone
    yields the document the vendor should have shipped — which is worth having
    on its own, because anything that reads OpenAPI can read it, including the
    vendor. Nothing here mentions a command line; `cli.yaml` is the layer that
    does.

    Applied with `ErrorOnZeroMatch`: an action that matches nothing fails the
    bless instead of lapsing quietly. Two actions below use that deliberately
    as tripwires — their JSONPaths state what the vendor currently says, so a
    vendor revision that changes it fails the bless rather than being silently
    overwritten.
extends: toy.yaml
actions:
  # ---------------------------------------------------------------- Money ---
  # The vendor declares `format: money` and never says what an amount is. A
  # format is a name for a rule and not a rule, so nothing can run it. Writing
  # the rule down as `pattern` states it in plain JSON Schema, which every
  # consumer of this document can run; giving it a schema name states it once,
  # for every field that carries an amount.
  #
  # The vendor's `format` comes along onto the named schema, because it is the
  # half of the pair that Rust reads: `xtask` calls `.replace("money", …)` and
  # the bless step emits the adoption's own fixed-point type wherever the
  # document declares the format. The document could not have described that
  # type — OpenAPI has no fixed-point decimal — and the `replace` call could
  # not have stated a rule, because a `format` is not one. The two compose, and
  # neither is a substitute for the other.
  - target: $.components.schemas
    description: Say what an amount is, once, under a name.
    update:
      Money:
        type: string
        format: money
        description: A decimal amount carried in a string.
        pattern: ^-?[0-9]+(\.[0-9]{1,2})?$

  # TRIPWIRE. The filter selects `Voucher.properties` only while `total` is
  # still declared `format: money`, and the step after it names `total`; under
  # ErrorOnZeroMatch a vendor who renames the field or retypes it as a number
  # makes this a zero match and fails the bless rather than being silently
  # overwritten.
  #
  # `update` merges, so the vendor's own words stay where the vendor put them
  # and `total` keeps its place — `--help` still reads in document order. What
  # the action adds is the reference, and OpenAPI 3.0 reads a `$ref` in
  # preference to whatever sits beside it.
  - target: "$.components.schemas.Voucher[?(@.total.format == 'money')].total"
    description: Point the vendor's amount at that rule.
    update:
      $ref: "#/components/schemas/Money"

  # ------------------------------------------------------------- Currency ---
  # The vendor types the currency as a bare string and says "ISO 4217 code" in
  # its description. Prose is a rule nothing can run either: the sentence that
  # tells a person what to send tells no parser anything. An ISO 4217 code is
  # three uppercase letters, so that is what the document says here — true of
  # the API, useful to everything that reads this file, and no business of
  # Rust's.
  #
  # This is the other route, on the field next door. `Money` above hands its
  # type to `Settings::replace`; `Currency` keeps the one the generator writes,
  # because a currency code wants the rule and no behaviour beyond it. One
  # schema, two fields, both ways of arriving at a type.
  - target: $.components.schemas
    description: Say what a currency code is, once, under a name.
    update:
      Currency:
        type: string
        description: An ISO 4217 currency code.
        pattern: ^[A-Z]{3}$

  # TRIPWIRE. The filter selects `Voucher.properties` only while `currency` is
  # still an undecorated string. A vendor who retypes it — as an `enum` of the
  # codes they really accept, say — makes this a zero match, and the answer
  # then is to drop the action rather than to point a string's rule at
  # something that has stopped being a string.
  - target: "$.components.schemas.Voucher[?(@.currency.type == 'string')].currency"
    description: Point the vendor's currency code at that rule.
    update:
      $ref: "#/components/schemas/Currency"

  # -------------------------------------------------- Undocumented field ---
  # The vendor returns and accepts a bookkeeping reference it forgot to
  # document. Adding it here puts it on the generated `Voucher` and on the
  # CLI's `--internal-ref` at once; the adopter writes nothing.
  - target: $.components.schemas.Voucher.properties
    description: Add the undocumented `internal_ref` field.
    update:
      internal_ref:
        type: string
        description: Vendor's internal bookkeeping reference (undocumented)

  # ---------------------------------------------- Undocumented operation ---
  - target: $.paths
    description: Add the undocumented `archiveVoucher` operation.
    update:
      /vouchers/{id}/archive:
        post:
          operationId: archiveVoucher
          summary: Archive a voucher (undocumented; vendor ships it)
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int64
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Voucher"
