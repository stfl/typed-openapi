overlay: 1.1.0
info:
  title: Corrections to the Toy Accounting API
  version: "1.0"
  description: >-
    What the vendor got wrong, as standard OpenAPI Overlay 1.1 actions.
    `spec/toy.yaml` is never edited.

    This layer is about the vendor's API and nothing else: an undocumented
    field, an undocumented operation, and a declared format the vendor never
    said the rule for. Applying it alone yields the document the vendor should
    have shipped — which is worth having on its own, because anything that
    reads OpenAPI can read it, including the vendor. Nothing here mentions a
    command line; `cli.yaml` is the layer that does.

    Applied with `ErrorOnZeroMatch`: an action that matches nothing fails the
    bless instead of lapsing quietly. The first action below uses that
    deliberately as a tripwire — its JSONPath states what the vendor currently
    says, so a vendor revision that changes it fails the bless rather than
    being silently overwritten.
extends: toy.yaml
actions:
  # ---------------------------------------------------------------- Money ---
  # The vendor declares `format: money` and never says what an amount is. A
  # format is a name for a rule and not a rule, so nothing can run it. Writing
  # the rule down as `pattern` states it in plain JSON Schema, which every
  # consumer of this document can run; giving it a schema name states it once,
  # for every field that carries an amount, and is what the bless step turns
  # into a `Money` newtype in Rust.
  - target: $.components.schemas
    description: Say what an amount is, once, under a name.
    update:
      Money:
        type: string
        description: A decimal amount carried in a string.
        pattern: ^-?[0-9]+(\.[0-9]{1,2})?$

  # TRIPWIRE. The filter selects `Voucher.properties` only while `total` is
  # still declared `format: money`, and the step after it names `total`; under
  # ErrorOnZeroMatch a vendor who renames the field or retypes it as a number
  # makes this a zero match and fails the bless rather than being silently
  # overwritten.
  #
  # `update` merges, so the vendor's own words stay where the vendor put them
  # and `total` keeps its place — `--help` still reads in document order. What
  # the action adds is the reference, and OpenAPI 3.0 reads a `$ref` in
  # preference to whatever sits beside it.
  - target: "$.components.schemas.Voucher[?(@.total.format == 'money')].total"
    description: Point the vendor's amount at that rule.
    update:
      $ref: "#/components/schemas/Money"

  # -------------------------------------------------- Undocumented field ---
  # The vendor returns and accepts a bookkeeping reference it forgot to
  # document. Adding it here puts it on the generated `Voucher` and on the
  # CLI's `--internal-ref` at once; the adopter writes nothing.
  - target: $.components.schemas.Voucher.properties
    description: Add the undocumented `internal_ref` field.
    update:
      internal_ref:
        type: string
        description: Vendor's internal bookkeeping reference (undocumented)

  # ---------------------------------------------- Undocumented operation ---
  - target: $.paths
    description: Add the undocumented `archiveVoucher` operation.
    update:
      /vouchers/{id}/archive:
        post:
          operationId: archiveVoucher
          summary: Archive a voucher (undocumented; vendor ships it)
          parameters:
            - name: id
              in: path
              required: true
              schema:
                type: integer
                format: int64
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Voucher"
