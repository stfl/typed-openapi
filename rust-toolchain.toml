# This repository's own tooling is nightly. The library is not: it compiles and
# tests on stable Rust, and CI's `stable` job builds and tests it on the current
# stable toolchain on every pull request and every push to `main`.
#
# Four of `rustfmt.toml`'s settings are nightly-only options —
# `group_imports`, `format_code_in_doc_comments`, `format_generated_files` and
# `hex_literal_case`. Stable rustfmt warns and ignores them rather than
# failing, so it will not undo the formatting; it also will not maintain it,
# which is why `just fmt` wants this toolchain. The coverage recipe's
# `--branch` rests on `-Z coverage-options=branch` and is nightly for the same
# kind of reason.
#
# The channel is a date, not `nightly`, so the compiler holds still until a
# pull request moves it. An undated `nightly` takes the newest clippy on every
# run, and a lint added overnight fails the gate on a change that never touched
# the code it names. Each move takes the newest date on which `just gate` passes.
# Dependabot's `rust-toolchain` entry proposes the next one weekly, and CI
# installs whatever this file names, with no `toolchain:` of its own.
[toolchain]
channel = "nightly-2026-10-20"
components = ["rustfmt", "clippy", "llvm-tools-preview"]
